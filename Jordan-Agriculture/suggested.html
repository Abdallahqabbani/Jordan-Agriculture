<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jordan Agriculture || Suggestions Form</title>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>

  <link rel="stylesheet" href="assets/css/suggested.css">
</head>
<body>
   <header class="header">
        <div class="social-media">
            <a href="./index.html"><i class="ri-home-line"></i></a>
        </div>
    </header>
  <form action="#" class="login-form" onsubmit="return validateRegister(event)">
    <h1 class="login-title">Suggest</h1>

    <div class="input-box">
      <i class='bx bxs-user'></i>
      <input type="text" id="firstName" placeholder="First name" required />
    </div>

    <div class="input-box">
      <i class='bx bxs-user'></i>
      <input type="text" id="lastName" placeholder="Last name" required />
    </div>

    <div class="input-box"><i class="ri-mail-fill"></i>
      <input type="email" placeholder="Email" required />
    </div>

    <div class="form-group">
        <select id="country" name="country" required>
          <option value="">Choose Country</option>
          <option value="jo">Jordan</option>
          <option value="sa">Saudi Arabia</option>
          <option value="eg">Egypt</option>
          <option value="lb">Lebanon</option>
          <option value="sy">Syria</option>
          <option value="other">Other</option>
        </select>
    </div>

    <div class="input-box">
     <i class="ri-phone-fill"></i>
      <input type="tel" placeholder="Phone Number" required />
    </div>

    <div class="form-group">
        <label for="suggestions">Suggestions Box</label>
        <textarea id="suggestions" name="suggestions" required></textarea>
    </div>
   
    <div class="login-btn">
      <ul>
        <li><button type="submit">Send</button></li>
      </ul>
    </div>

    <p class="error-message" id="error-message"></p>
  </form>

  <script src="assets/js/suggested.js"></script>
</body>
</html>
